<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <!-- Maroon Gradients -->
    <radialGradient id="maroonRadial" cx="50%" cy="45%" r="55%" fx="45%" fy="35%">
      <stop offset="0%" stop-color="#9A0808" />
      <stop offset="45%" stop-color="#7A0000" />
      <stop offset="85%" stop-color="#480000" />
      <stop offset="100%" stop-color="#2D0000" />
    </radialGradient>
    <radialGradient id="outerVignette" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.65" />
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE095" />
      <stop offset="30%" stop-color="#E8C57A" />
      <stop offset="50%" stop-color="#FFF4D0" />
      <stop offset="70%" stop-color="#C99F55" />
      <stop offset="100%" stop-color="#9E7632" />
    </linearGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="35%" stop-color="#FCE095" />
      <stop offset="70%" stop-color="#E8C57A" />
      <stop offset="100%" stop-color="#B88A3A" />
    </linearGradient>

    <!-- Filter for subtle luxury glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Oxblood/Maroon Circle Background -->
  <circle cx="600" cy="600" r="560" fill="url(#maroonRadial)" />
  <circle cx="600" cy="600" r="560" fill="url(#outerVignette)" />

  <!-- Outer Double Gold Ring -->
  <circle cx="600" cy="600" r="552" fill="none" stroke="url(#goldBorder)" stroke-width="3" opacity="0.85" />
  <circle cx="600" cy="600" r="538" fill="none" stroke="url(#goldBorder)" stroke-width="1.2" opacity="0.5" stroke-dasharray="6 3" />

  <!-- Inner Subtle Gold Ring -->
  <circle cx="600" cy="600" r="526" fill="none" stroke="url(#goldBorder)" stroke-width="0.8" opacity="0.3" />

  <!-- Gold Monogram Image Embedded / Centered -->
  <g transform="translate(240, 240) scale(0.8)">
    <image href="/brand/logo-gold-monogram.png" width="898" height="613" />
  </g>

  <!-- Wordmark "TIME FREEZE" -->
  <g text-anchor="middle" id="badge-wordmark">
    <text x="600" y="860" font-family="'Cormorant Garamond', 'Playfair Display', 'Cinzel', serif" font-size="64" font-weight="600" letter-spacing="12" fill="url(#goldText)" filter="url(#softGlow)">
      TIME FREEZE
    </text>
    <text x="600" y="905" font-family="'Inter', 'DM Sans', sans-serif" font-size="16" font-weight="400" letter-spacing="18" fill="#E8C57A" opacity="0.85">
      PHOTOGRAPHY STUDIO
    </text>
  </g>

  <!-- Bottom Accent Gold Star/Diamond -->
  <path d="M 600 940 L 605 948 L 613 953 L 605 958 L 600 966 L 595 958 L 587 953 L 595 948 Z" fill="url(#goldBorder)" opacity="0.9" />
</svg>
