<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Time Freeze — Fine Art Wedding & Portrait Photography Studio</title>
    <meta
      name="description"
      content="Time Freeze is an elite South Indian fine art photography studio led by Bhuvan, capturing sacred weddings, maternity, newborn milestones, and unscripted heirlooms across Madurai, Coimbatore, and South India."

    <meta name="theme-color" content="#0B0A09" />

    <link rel="icon" type="image/png" href="/brand/logo-badge.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://timefreeze.in/" />
    <meta property="og:title" content="Time Freeze — Fine Art Wedding & Portrait Photography" />

      content="A moment held perfectly still. Honest South Indian wedding stories, maternity elegance, and candid portraits preserved with fine art mastery."

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />

      property="twitter:description"
      content="A moment held perfectly still. South Indian fine-art wedding and portrait photography."

    <link rel="preconnect" href="https://fonts.googleapis.com" />

        "address": {
